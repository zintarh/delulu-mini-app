# User entity - tracks user profiles and activity
type User @entity(immutable: false) {
  id: Bytes! # Wallet address
  totalStaked: BigInt! # Total amount user has staked across all delulus
  username: String # Username set via ProfileUpdated event
  metadataHash: String # IPFS CID for encrypted metadata (deprecated in v2, kept for compatibility)
  deluluPoints: BigInt! # Points earned from milestones, challenges, and forfeit proof resolutions
  
  # Reverse lookups
  delulus: [Delulu!]! @derivedFrom(field: "creator")
  claims: [Claim!]! @derivedFrom(field: "user")
  milestones: [Milestone!]! @derivedFrom(field: "creator")
  forfeitCommitments: [ForfeitCommitment!]! @derivedFrom(field: "creator")
}

# Delulu entity - tracks each delulu/market
type Delulu @entity(immutable: false) {
  id: ID! # The onChainId.toString()
  onChainId: BigInt! # Raw on-chain ID
  creator: User! # Relation to User entity
  creatorAddress: String! # Lowercase address string
  contentHash: String! # IPFS hash
  token: Bytes # ERC20 token address for this market (fetched from on-chain)
  
  # Timestamps and Deadlines
  stakingDeadline: BigInt # When staking closes (fetched from on-chain)
  resolutionDeadline: BigInt # When resolution should happen (fetched from on-chain)
  createdAt: BigInt! # Block timestamp when created
  
  # Financials - new contract structure
  totalSupportCollected: BigInt! # Total support collected
  totalSupporters: BigInt! # Number of supporters
  creatorStake: BigInt! # Initial support from creator
  creatorIsStaked: Boolean # v3: whether creator currently has stake locked
  creatorStakeCurrent: BigInt # v3: live creator stake after slashing/refunds

  # Combined G$ total — creatorStake + totalSupportCollected (sorted by this on leaderboard)
  totalG: BigInt!

  # Shares
  shareSupply: BigInt! # Total shares minted for this delulu
  tradeCount: BigInt! # Total number of share trades (buys + sells)
  uniqueBuyerCount: BigInt! # Number of distinct addresses that have ever bought shares
  
  # Challenge and Milestone tracking
  challengeId: BigInt # Challenge ID if joined (nullable)
  points: BigInt # Points allocated to this delulu (nullable until allocated)
  milestoneCount: BigInt! # Number of milestones
  
  # Status trackers
  isResolved: Boolean! # Whether delulu is resolved (time-based: resolutionDeadline passed)
  isCancelled: Boolean! # Whether delulu is cancelled
  rewardClaimed: Boolean! # Whether personal support has been claimed
  challengeRewardClaimed: Boolean! # Whether challenge reward has been claimed (separate flag)
  isFailed: Boolean # v3: whether goal has been marked failed
  failedStakePool: BigInt # v3: total stake pool for refunds on failure
  totalSupportForProRata: BigInt # v3: total support used for pro‑rata refunds
  
  # Reverse lookups
  claims: [Claim!]! @derivedFrom(field: "delulu")
  milestones: [Milestone!]! @derivedFrom(field: "delulu")
}

# Claim entity - tracks reward claims
type Claim @entity(immutable: true) {
  id: ID! # txHash-logIndex
  delulu: Delulu! # Relation to Delulu
  user: User! # Relation to User
  amount: BigInt! # Amount claimed
  claimType: String! # "support" or "challenge"
  txHash: Bytes! # Transaction hash
  createdAt: BigInt! # Block timestamp
}

# Milestone entity - tracks milestones for delulus
type Milestone @entity(immutable: false) {
  id: ID! # deluluId-milestoneId
  delulu: Delulu! # Relation to Delulu
  milestoneId: BigInt! # On-chain milestone ID
  creator: User! # Creator of the delulu (for convenience)
  descriptionHash: Bytes! # Hash of milestone description
  milestoneURI: String # Human-readable description / IPFS CID
  deadline: BigInt! # Milestone deadline
  startTime: BigInt # v3: when this milestone's duration starts
  tippingWindowStart: BigInt # v3: when tipping re-opens after proof
  tippingWindowEnd: BigInt # v3: when tipping closes
  isMissed: Boolean # v3: true if deadline passed without valid proof
  proofLink: String # Proof link submitted (nullable until submitted)
  isSubmitted: Boolean! # Whether milestone has been submitted
  isVerified: Boolean! # Whether milestone has been verified
  pointsEarned: BigInt! # Points earned when verified
  totalSupport: BigInt # v3: total support tipped to this milestone
  submittedAt: BigInt # Block timestamp when submitted (nullable)
  verifiedAt: BigInt # Block timestamp when verified (nullable)
  rejectedAt: BigInt # Block timestamp when rejected (nullable)
  rejectionReason: String # Reason for rejection if rejected
  isDeleted: Boolean! # Whether milestone has been deleted by creator
  earlyCompletionBonus: BigInt # Bonus points awarded for early completion
  streakBonus: BigInt # Bonus points awarded for streak
  tipCount: BigInt! # Number of tips received on this milestone
  totalTipSupport: BigInt! # Total G$ tipped to this milestone
}

# Challenge entity - tracks admin-created challenges
type Challenge @entity(immutable: false) {
  id: ID! # Challenge ID
  challengeId: BigInt! # On-chain challenge ID
  contentHash: String! # Challenge content hash
  poolAmount: BigInt! # Total pool amount
  startTime: BigInt! # When challenge starts
  duration: BigInt! # Challenge duration
  totalPoints: BigInt! # Total points allocated across all delulus
  active: Boolean! # Whether challenge is active
  createdAt: BigInt! # Block timestamp when created
  isCommunity: Boolean! # Community campaign (not delulu-linked)
  isEnded: Boolean! # Community campaign ended early
  endedAt: BigInt # When community campaign ended
  proofIntervalSeconds: BigInt # Proof cadence for community campaigns
  milestoneCount: BigInt! # On-chain milestone definitions count
  # Economics (v4)
  isPaid: Boolean! # Whether joining requires a stake
  joinToken: Bytes # Token address for paid join (null = default currency)
  joinAmount: BigInt! # Stake amount for paid campaigns
  forfeitPct: Int! # Forfeit % per missed milestone (0, 2, 5, or 10)
  forfeitPool: BigInt! # Accumulated forfeit pool from missed milestones
  participants: [CommunityCampaignParticipant!]! @derivedFrom(field: "challenge")
  proofs: [CommunityProof!]! @derivedFrom(field: "challenge")
  milestones: [CommunityCampaignMilestone!]! @derivedFrom(field: "challenge")
  milestoneCompletions: [CommunityCampaignMilestoneCompletion!]! @derivedFrom(field: "challenge")
}

# Admin-defined milestone for a community campaign
type CommunityCampaignMilestone @entity(immutable: false) {
  id: ID! # challengeId-milestoneId
  challenge: Challenge!
  challengeId: BigInt!
  milestoneId: BigInt!
  milestoneURI: String!
  startTime: BigInt!
  deadline: BigInt!
  createdAt: BigInt!
}

# Per-participant milestone completion
type CommunityCampaignMilestoneCompletion @entity(immutable: true) {
  id: ID! # txHash-logIndex
  challenge: Challenge!
  challengeId: BigInt!
  milestone: CommunityCampaignMilestone!
  milestoneId: BigInt!
  participant: User!
  participantAddress: String!
  proofLink: String!
  pointsAwarded: BigInt!
  pointsTotal: BigInt!
  txHash: Bytes!
  createdAt: BigInt!
}

# Community campaign participant — indexed from joinCommunityCampaign / joinCommunityCampaignPaid
type CommunityCampaignParticipant @entity(immutable: false) {
  id: ID! # challengeId-participantAddress
  challenge: Challenge!
  challengeId: BigInt!
  participant: User!
  participantAddress: String!
  pointsTotal: BigInt!
  completedMilestoneCount: BigInt!
  streak: BigInt!
  lastProofAt: BigInt
  joinedAt: BigInt!
  # Economics (v4)
  stakeAmount: BigInt! # Amount staked (0 for free campaigns)
  forfeitedAmount: BigInt! # Cumulative forfeited stake from missed milestones
}

# Community proof submission — indexed from submitCommunityProof
type CommunityProof @entity(immutable: true) {
  id: ID! # txHash-logIndex
  challenge: Challenge!
  challengeId: BigInt!
  participant: User!
  participantAddress: String!
  proofLink: String!
  pointsAwarded: BigInt!
  pointsTotal: BigInt!
  txHash: Bytes!
  createdAt: BigInt!
}

# Personal stake-or-lose commitment — indexed from ForfeitMarket.createCommitment
type ForfeitCommitment @entity(immutable: false) {
  id: ID! # "fm1-" + commitmentId
  commitmentId: BigInt!
  creator: User!
  creatorAddress: String!
  token: Bytes!
  stakeAmount: BigInt!
  destinationType: Int! # 0=SelfReturn,1=Charity,2=Friend,3=CommunityPool
  destinationAddr: Bytes
  cadence: Int! # 0=Once,1=Daily,2=Weekday,3=Weekly,4=Monthly
  periodSeconds: BigInt!
  totalPeriods: Int!
  currentPeriodIndex: Int!
  currentPeriodDeadline: BigInt!
  verifier: Bytes # zero address = self/AI-gated-self verification
  hasPendingVerifierInvite: Boolean!
  active: Boolean!
  cancelled: Boolean!
  createdAt: BigInt!
  resolutions: [ForfeitPeriodResolution!]! @derivedFrom(field: "commitment")
  friendRewards: [ForfeitFriendReward!]! @derivedFrom(field: "commitment")
}

# Immutable per-period outcome log — the rich history the contract itself doesn't store.
type ForfeitPeriodResolution @entity(immutable: true) {
  id: ID! # txHash-logIndex
  commitment: ForfeitCommitment!
  commitmentId: BigInt!
  periodIndex: Int!
  outcome: String! # "success" | "forfeited"
  resolver: Bytes! # creator/verifier on success, keeper on forfeiture
  creatorAddress: String! # denormalized so monthly-leaderboard queries can group by
                           # who earned the points, regardless of who resolved
  pointsAwarded: BigInt # success only — added to the creator's User.deluluPoints
  bountyPaid: BigInt # forfeiture only
  platformFee: BigInt # forfeiture only
  destinationType: Int # forfeiture only
  destinationAddr: Bytes # forfeiture only
  amountToDestination: BigInt # forfeiture only
  txHash: Bytes!
  createdAt: BigInt!
}

# Immutable log of Friend-destination forfeitures credited to pendingFriendReward —
# separate from ForfeitPeriodResolution because cancelCommitment (a valid forfeiture
# path) never creates one of those, so a query relying on it would silently miss
# friend rewards from voluntary cancellations. The claimable balance itself is
# read live from the contract (pendingFriendReward); this entity is history/
# notification-trigger only, not a running balance.
type ForfeitFriendReward @entity(immutable: true) {
  id: ID! # txHash-logIndex
  commitment: ForfeitCommitment!
  commitmentId: BigInt!
  recipientAddress: String!
  token: Bytes!
  amount: BigInt!
  txHash: Bytes!
  createdAt: BigInt!
}
