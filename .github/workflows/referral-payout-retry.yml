name: Referral payout retry

# Hits the existing /api/cron/referral-payout-retry endpoint hourly so a
# failed on-chain G$ deposit gets retried promptly instead of waiting for
# the once-a-day Vercel cron (vercel.json). Free — GitHub Actions' scheduler,
# not Vercel's, so this doesn't depend on the Vercel plan tier (Hobby only
# allows daily crons).
#
# Setup: add a repo secret PUSH_CRON_SECRET matching the CRON_SECRET (or
# PUSH_CRON_SECRET) env var already set in the Vercel project.
# Settings → Secrets and variables → Actions → New repository secret.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  retry-failed-payouts:
    runs-on: ubuntu-latest
    steps:
      - name: Call referral-payout-retry
        run: |
          curl -sf -X GET "https://www.staydelulu.xyz/api/cron/referral-payout-retry" \
            -H "x-cron-secret: ${{ secrets.PUSH_CRON_SECRET }}" \
            --max-time 280
